services:
  ollama-1:
    image: ollama/ollama:0.11.10
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    environment:
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - type: bind
        source: /models/ollama
        target: /root/.ollama
        bind:
          create_host_path: false

  ollama-2:
    extends:
      service: ollama-1
